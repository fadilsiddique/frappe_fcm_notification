[project]
name = "frappe_fcm_notification"
authors = [
    { name = "Upscape Technologies", email = "info@upscapetech.com"}
]
description = "Trigger fcm notification from frappe"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
    "google-auth>=2.48.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
